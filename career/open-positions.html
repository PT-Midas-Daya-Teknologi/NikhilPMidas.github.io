<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Open Positions | Wowoni Private Limited</title>
<meta name="description" content="Explore career opportunities at Wowoni. Follow us on LinkedIn for updates about future openings.">

<link rel="icon" href="../assets/images/wowoni-logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet">






</head>
<body class="open-positions-page">
    <div class="boxed_wrapper">
        <div data-wowoni-include="header"></div>
        <div data-wowoni-include="mobile-menu"></div>

        <main>
            <section class="positions-hero" aria-labelledby=\"positions-title\">
                <div class="positions-hero-frame">
                    <img src="../assets/images/background/open-position-hero.png" alt="" fetchpriority="high" aria-hidden="true">
                    <div class="positions-hero-shade" aria-hidden="true"></div>
                    <div class="auto-container positions-hero-content">
                        <h1 id=\"positions-title\">Come help us build thoughtful banking technology and move businesses forward.</h1>
                        <a class="positions-button" href="#open-positions">
                            Join Us <i class="fas fa-arrow-right" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>
            </section>

            <section class="positions-listing" id="open-positions" aria-label="Open Positions">
                <div class="auto-container">
                    <div class="row positions-row">
                        <div class="col-lg-3 col-md-6 col-sm-12 positions-column">
                            <article class="positions-empty-card">
                                <h2>Your dream job is coming soon!</h2>
                                <p>We are actively looking for talented individuals to join our team. Please check back later or visit our LinkedIn page for updates.</p>
                                <a class="positions-linkedin-button" href="https://www.linkedin.com/company/wowoni-private-limited/mycompany/?viewAsMember=true" target="_blank" rel="noopener noreferrer">
                                    VISIT LINKEDIN
                                </a>
                            </article>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div data-wowoni-include="footer"></div>
    </div>

    <script src="../assets/js/jquery.js"></script>
    <script src="../assets/js/popper.min.js"></script>
    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/owl.js"></script>
    <script src="../assets/js/wow.js"></script>
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/jquery.fancybox.js"></script>
    <script src="../assets/js/appear.js"></script>
    <script src="../assets/js/parallax-scroll.js"></script>
    <script src="../assets/js/jquery.nice-select.min.js"></script>
    <script src="../assets/js/data-animation.js"></script>
    <script src="../assets/js/bxslider.js"></script>
    <script src="../assets/js/isotope.js"></script>
    <script src="../assets/js/script.js"></script>
</body>
</html>
